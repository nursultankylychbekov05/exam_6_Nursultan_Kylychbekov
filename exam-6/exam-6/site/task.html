@{
Layout = "layout";
}

<h2 style="text-align: center;">Информация о задаче №@Model.Id</h2>

<div style="border: 1px solid #ccc; padding: 20px; border-radius: 5px; background: #fff; max-width: 600px; margin: 0 auto;">
    <p><strong>Заголовок:</strong> @Model.Title</p>
    <p><strong>Исполнитель:</strong> @Model.Assignee</p>
    <p><strong>Дата создания:</strong> @Model.CreatedAt</p>
    <p><strong>Дата завершения:</strong> @Model.CompletedAt</p>
    <p><strong>Статус:</strong> @Model.Status</p>

    <p><strong>Описание:</strong></p>
    <div style="background: #f9f9f9; padding: 12px; border: 1px solid #eee; border-radius: 4px; min-height: 80px; white-space: pre-wrap;">@Model.Description</div>

    <div style="margin-top: 20px;">
        <a href="/index.html" style="text-decoration: none; color: #0066cc; font-weight: bold;">← Вернуться к списку</a>
    </div>
</div>
