@{
Layout = "layout";
}

<h2 style="text-align: center;">Задача #@Model.Id</h2>

<div style="border: 1px solid #ccc; padding: 20px; border-radius: 5px; background: #fff; max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding-bottom: 15px; margin-bottom: 20px;">
        <div>
            <p style="margin: 4px 0;"><strong>Исполнитель задачи:</strong> @Model.Assignee</p>
            <p style="margin: 4px 0;"><strong>Дата создания:</strong> @Model.CreatedAt</p>
            <p style="margin: 4px 0;"><strong>Дата выполнения:</strong> @Model.CompletedAt</p>
            <p style="margin: 4px 0;"><strong>Статус:</strong> @Model.Status</p>
        </div>

        <div class="actions-group" style="align-items: flex-start;">
            <a href="/editTask.html?id=@Model.Id" class="btn-action btn-edit">Редактировать</a>
            @if (Model.Status == "new")
            {
            <a href="/completeTask?id=@Model.Id" class="btn-action btn-done">Выполнить</a>
            }
            <a href="/confirmDelete.html?id=@Model.Id" class="btn-action btn-delete">Удалить</a>
        </div>
    </div>
    
    <h3 style="margin-top: 0; text-align: center;">Описание задачи</h3>
    <div style="white-space: pre-wrap; line-height: 1.6; color: #333; min-height: 100px;">@Model.Description</div>

    <div style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px;">
        <a href="/index.html" style="text-decoration: none; color: #0066cc; font-weight: bold;">← Вернуться к списку</a>
    </div>
</div>
