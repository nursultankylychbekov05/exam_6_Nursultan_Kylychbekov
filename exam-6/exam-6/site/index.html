@{
Layout = "layout";
}

<h2 style="text-align: center;">Список Задач</h2>

<table>
    <thead>
    <tr>
        <th>Id</th>
        <th>Заголовок</th>
        <th>Имя исполнителя</th>
        <th>Дата создания</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody>
    @foreach (var task in Model)
    {
    <tr>
        <td>@task.Id</td>
        <td>@task.Title</td>
        <td>@task.Assignee</td>
        <td>@task.CreatedAt</td>
        <td>@task.Status</td>
    </tr>
    }
    </tbody>
</table>
