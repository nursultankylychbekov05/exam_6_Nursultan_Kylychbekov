@{
Layout = "layout";
}

<h2 style="text-align: center;">Редактирование задачи №@Model.Id</h2>

<div style="border: 1px solid #ccc; padding: 20px; border-radius: 5px; background: #fff; max-width: 500px; margin: 0 auto;">
    <form action="/saveEditedTask" method="post">
        <input type="hidden" name="id" value="@Model.Id" />

        <label for="title">Заголовок</label>
        <input type="text" id="title" name="title" value="@Model.Title" required style="width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box;" />

        <label for="assignee">Исполнитель</label>
        <input type="text" id="assignee" name="assignee" value="@Model.Assignee" required style="width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box;" />

        <label for="description">Описание</label>
        <textarea id="description" name="description" rows="5" required style="width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box;">@Model.Description</textarea>

        <button type="submit" style="width: 100%; padding: 10px; background: #0066cc; color: white; border: none; cursor: pointer; font-weight: bold;">Сохранить изменения</button>
    </form>
</div>
