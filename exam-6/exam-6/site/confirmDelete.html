@{
Layout = "layout";
}

<h2 style="text-align: center;">Подтверждение удаления</h2>

<div style="border: 1px solid #ccc; padding: 20px; border-radius: 5px; background: #fff; max-width: 450px; margin: 0 auto; text-align: center;">
    <p>Вы действительно хотите удалить задачу <strong>"@Model.Title"</strong>?</p>
    <div style="display: flex; justify-content: center; gap: 15px; margin-top: 20px;">
        <a href="/deleteTask?id=@Model.Id" style="padding: 10px 20px; background: #d9534f; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">Да, удалить</a>
        <a href="/index.html" style="padding: 10px 20px; background: #ccc; color: black; text-decoration: none; border-radius: 4px; font-weight: bold;">Отмена</a>
    </div>
</div>
